			name="description"

		<meta
			property="og:title"
			content="Dr. Rusakova Clinic — Клініка дерматології та косметології"
			data-rh="true" />
		<meta
			property="og:description"

		<meta property="og:type" content="website" data-rh="true" />
		<link rel="canonical" href="https://dr-rusakova.com.ua/" data-rh="true" />

		<script type="text/javascript">
			(function (l) {
			  if (l.search[1] === '/') {
			    var decoded = l.search
			      .slice(1)
			      .split('&')
			      .map(function (s) {
			        return s.replace(/~and~/g, '&');
			      })
			      .join('?');
			    window.history.replaceState(
			      null,
			      null,
			      l.pathname.slice(0, -1) + decoded + l.hash
			    );
			  }
			})(window.location);
		</script>
		<!-- Google tag (gtag.js) -->
		<script
			async
			src="https://www.googletagmanager.com/gtag/js?id=G-N27LHHPKG4"></script>
